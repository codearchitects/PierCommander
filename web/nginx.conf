# Serves the built SPA and proxies the API calls to the FilesystemApi
# container, so the browser sees a single origin and no CORS is needed.
upstream filesystem_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; index.html never is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /fs {
        proxy_pass http://filesystem_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page application: unknown paths fall back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
