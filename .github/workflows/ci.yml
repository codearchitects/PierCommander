name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run it superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: FilesystemApi (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # The container's declared build command (targetProfile.build).
      - name: Build
        run: python -m compileall -q src

      - name: Test
        run: python -m pytest -q --junitxml=../pytest-report.xml

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore

  web:
    name: PierCommanderWeb (react)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npx vitest run --coverage

      # The container's declared build command (targetProfile.build).
      - name: Build
        run: npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  traceability:
    name: Requirement traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fails on link-rot (a §REQ: citation with no matching @id);
      # reports requirements not yet implemented without failing.
      - name: Check the requirement chain
        run: python3 scripts/check_traceability.py

      # docs/traceability.md is generated: if it no longer matches the
      # citations in the tree, it is documentation that lies.
      - name: The traceability doc is up to date
        run: |
          set -euo pipefail
          python3 scripts/gen_traceability_doc.py
          if ! git diff --quiet -- docs/traceability.md; then
            echo "::error::docs/traceability.md è disallineato. Rigeneralo con: python3 scripts/gen_traceability_doc.py"
            git diff -- docs/traceability.md
            exit 1
          fi
          echo "docs/traceability.md allineato."

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build FilesystemApi image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: piercommander-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build PierCommanderWeb image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          load: true
          tags: piercommander-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # A compose that starts is the only proof the two images fit together.
      - name: Smoke test the composition
        env:
          IMAGE_TAG: ci
        run: |
          set -euo pipefail
          docker network create pier-ci
          docker run -d --name api --network pier-ci -e FS_ROOT=/data piercommander-api:ci
          docker run -d --name web --network pier-ci -p 8080:80 piercommander-web:ci
          # Wait for the API *through the proxy*: the UI shell answers
          # before uvicorn is listening, so serving it proves nothing.
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8080/fs?path=" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "--- UI shell ---"
          curl -fsS http://127.0.0.1:8080/ | head -5
          echo "--- API through the nginx proxy ---"
          curl -fsS "http://127.0.0.1:8080/fs?path=" | head -5

      - name: Container logs
        if: failure()
        run: docker logs api; docker logs web

  ci:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [backend, web, traceability, images]
    if: always()
    steps:
      - name: Verify every lane is green
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more CI lanes failed."
            exit 1
          fi
          echo "All CI lanes green."
