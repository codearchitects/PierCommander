version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, backend]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, web]
    groups:
      # One PR for the whole test toolchain instead of six.
      testing:
        patterns: ['@testing-library/*', 'vitest', '@vitest/*', 'jsdom', 'msw']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directories: [/backend, /web]
    schedule:
      interval: weekly
    labels: [dependencies, ci]
