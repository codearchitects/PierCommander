# PierCommander -- deployment composition.
#
# NOT the CAIP-generated .caep/docker-compose.yml (which is rewritten from
# the C4 model on every refresh and must never be hand-edited). This file
# is the *deployment* artifact: it runs the published GHCR images on a
# target host, and is what .github/workflows/deploy.yml copies over.
#
#   local build : docker compose -f deploy/docker-compose.yml up --build
#   published   : IMAGE_TAG=v1.0.0 docker compose -f deploy/docker-compose.yml up -d
services:
  api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-codearchitects/piercommander}-api:${IMAGE_TAG:-latest}
    build:
      context: ../backend
    environment:
      # The one directory PierCommander is allowed to touch, inside the
      # container. Change the host side of the volume, not this.
      FS_ROOT: /data
    volumes:
      - ${FS_HOST_ROOT:-./data}:/data
    restart: unless-stopped
    expose:
      - "8000"

  web:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-codearchitects/piercommander}-web:${IMAGE_TAG:-latest}
    build:
      context: ../web
      args:
        # Empty on purpose: same-origin calls, proxied to api by nginx.
        VITE_FS_API_URL: ""
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
