[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "filesystem-api"
version = "0.1.0"
description = "FilesystemApi backend - essential filesystem operations"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<0.144",
    "uvicorn>=0.32,<0.33",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<0.28",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
