feature:
  title: Operazioni essenziali sul filesystem
  description:
    - As a utente di PierCommander
    - >-
      I want poter elencare, navigare, creare, rinominare, copiare, spostare, cancellare e visualizzare file e cartelle
      tramite API
    - So that posso gestire il mio filesystem da browser come farei con un file manager desktop
  comments:
    - >-
      Essential filesystem operations exposed by the Python backend: list, navigate, create, rename, delete, copy, move
      and view.
    - Qui ci metto le operazioni di base sul filesystem che il backend Python deve esporre.
  tags:
    - c4-id:be4cea64-db47-3743-5ba1-7607b9085693
