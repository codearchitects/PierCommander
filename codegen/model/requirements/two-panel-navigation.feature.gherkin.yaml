feature:
  title: Navigazione a due pannelli
  description:
    - As a utente di PierCommander
    - >-
      I want navigare ed eseguire i comandi essenziali sul filesystem tramite un'interfaccia a due pannelli in stile
      Norton Commander
    - >-
      So that posso orientarmi rapidamente tra due posizioni del filesystem e agire su file e cartelle senza lasciare il
      browser
  comments:
    - Norton-Commander-style two-panel browser UI for navigating and acting on the filesystem.
    - Qui ci metto l'interfaccia a due pannelli in stile Norton Commander per navigare e lavorare sui file.
  tags:
    - c4-id:f6f303a3-7b2f-9935-2132-54e040412e5f
