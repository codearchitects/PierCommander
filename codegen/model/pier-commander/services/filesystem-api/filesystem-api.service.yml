type: service
name: FilesystemApi
description: >-
  Backend Python che espone le operazioni essenziali di gestione del filesystem
  (elenco, navigazione, copia, spostamento, cancellazione, rinomina, creazione
  cartelle, lettura file) tramite API HTTP.
namespace: PierCommander.Backend
targetProfile:
  platform: headless
  language: python
  framework: fastapi
  build: python3 -m compileall -q src
  test: python3 -m pytest
  run: uvicorn app:api
  cwd: backend
